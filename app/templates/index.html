<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus</title>
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Markdown & Code Highlighting Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-top">
            <div class="brand-title">
                <span>Nexus</span>
            </div>
            <button class="new-chat-btn" id="newChatBtn">+ New Chat</button>

            <div class="model-select-group">
                <label class="select-label" for="modelSelect">Select Model</label>
                <select id="modelSelect">
                    <option value="groq-20b">GPT-OSS 20B (Groq)</option>
                    <option value="gemini-flash">Gemini Flash</option>
                </select>
            </div>

            <div class="model-select-group">
                <label class="select-label" for="searchInput">Chat Library</label>
                <input type="text" id="searchInput" placeholder="Search chats...">
            </div>
        </div>

        <div class="history-list" id="historyList">
            <div class="history-item active">
                <span class="history-title-text">New Conversation</span>
                <div class="history-actions">
                    <button class="history-delete-btn">&times;</button>
                </div>
            </div>
        </div>

        <div class="sidebar-bottom">
            <button class="theme-toggle-btn" id="themeToggleBtn" title="Toggle Theme">
                <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2v2"></path>
                    <path d="M12 20v2"></path>
                    <path d="m4.93 4.93 1.41 1.41"></path>
                    <path d="m17.66 17.66 1.41 1.41"></path>
                    <path d="M2 12h2"></path>
                    <path d="M20 12h2"></path>
                    <path d="m6.34 17.66-1.41 1.41"></path>
                    <path d="m19.07 4.93-1.41 1.41"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- Chat Workspace -->
    <div class="chat-workspace">
        <div class="workspace-header">
            New Conversation
        </div>

        <div class="messages-container" id="messagesContainer">
            <div class="message ai-message">
                Hello! I am your local Nexus assistant. How can I help you today?
            </div>
        </div>

        <div class="input-wrapper">
            <div class="input-container">
                <textarea id="promptInput" rows="1" placeholder="Type your message here... (Press Enter to send)"></textarea>
                <button id="sendBtn">Send</button>
            </div>
            <div class="counter-bar">
                Words: 0 | Est. Tokens: 0
            </div>
        </div>
    </div>

    <!-- Frontend Controller Script -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
